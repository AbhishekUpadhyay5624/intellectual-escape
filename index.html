<!doctype html>
<html lang="en" data-theme="dark" data-reading-size="medium">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A little room for curiosity and feeling. Psychology and stories, one full-screen moment at a time."
    />
    <meta name="theme-color" content="#08090d" />
    <title>Escape · Room for wonder</title>
    <script>
      try {
        const preferences = JSON.parse(
          localStorage.getItem("ie-appearance") || "{}",
        );
        const theme = ["dark", "light", "system"].includes(preferences.theme)
          ? preferences.theme
          : "dark";
        document.documentElement.dataset.theme =
          theme === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : theme;
        if (["small", "medium", "large"].includes(preferences.readingSize))
          document.documentElement.dataset.readingSize =
            preferences.readingSize;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
